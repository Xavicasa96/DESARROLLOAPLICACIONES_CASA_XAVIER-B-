{% extends "base.html" %}

{% block title %}Proveedores - Proyecto Integrador{% endblock %}

{% block content %}
<h2 class="mb-4">Directorio de Proveedores</h2>
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>RUC</th>
                <th>Empresa</th>
                <th>Contacto</th>
                <th>Teléfono</th>
            </tr>
        </thead>
        <tbody>
            {% for p in proveedores %}
            <tr>
                <td>{{ p.ruc }}</td>
                <td>{{ p.empresa }}</td>
                <td>{{ p.contacto }}</td>
                <td>{{ p.telefono }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
