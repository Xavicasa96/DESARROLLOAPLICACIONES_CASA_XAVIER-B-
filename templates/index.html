{% extends "base.html" %}

{% block title %}Inicio - Proyecto Integrador{% endblock %}

{% block content %}
<div class="p-5 mb-4 bg-light rounded-3 shadow-sm">
    <div class="container-fluid py-3">
        <!-- Uso de variable y filtro upper -->
        <h1 class="display-5 fw-bold">{{ info.nombre|upper }}</h1>
        <p class="col-md-8 fs-4">Aplicación desarrollada con Python, Flask y Jinja2.</p>
        <p class="text-muted">Versión actual: <strong>{{ info.version }}</strong></p>
        <hr class="my-4">
        <a class="btn btn-primary btn-lg" href="{{ url_for('productos') }}" role="button">Ver Productos</a>
    </div>
</div>
{% endblock %}
